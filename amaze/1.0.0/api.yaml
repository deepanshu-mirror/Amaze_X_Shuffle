      - name: sort_order
        description: "asc | desc"
        required: false
        multiline: false
        example: "desc"
        schema:
          type: string
    returns:
      schema:
        type: object
  - name: get_ai_threats_logs
    description: "Paginated AI-threats (AI-deception layer) logs."
    parameters:
      - name: protocol
        description: "Protocol filter"
        required: false
        multiline: false
        example: ""
        schema:
          type: string
      - name: ip
        description: "Source IP filter"
        required: false
        multiline: false
        example: ""
        schema:
          type: string
      - name: site_id
