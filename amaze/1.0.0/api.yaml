      schema:
        type: object
  # ── Sites / context / enrichment ─────────────────────────────────────────
  - name: list_sites
    description: "List sites the caller is authorised to see."
    parameters: []
    returns:
      schema:
        type: array
  - name: get_site_summary
    description: "Summary stats for a single site."
    parameters:
      - name: site_id
        description: "Site UUID"
        required: true
        multiline: false
        example: "00000000-0000-0000-0000-000000000000"
        schema:
          type: string
    returns:
      schema:
        type: object
  - name: check_ip_reputation
    description: "Check IP reputation via the AMaze proxy (IPQS | AbuseIPDB | VirusTotal)."
    parameters:
      - name: ip
        description: "IP address to check"
        required: true
        multiline: false
        example: "185.220.101.34"
        schema:
          type: string
      - name: source
        description: "Reputation provider"
        required: false
        multiline: false
        options:
          - ipqs
          - abuseipdb
          - virustotal
        example: "ipqs"
        schema:
          type: string
    returns:
      schema:
        type: object
  - name: list_protocols
    description: "List active protocols tracked by the platform."
    parameters: []
    returns:
      schema:
        type: array
  - name: get_alert_config
    description: "Get the auto-ticketing alert configuration."
    parameters: []
    returns:
      schema:
        type: object
  # ── Audit & reports ──────────────────────────────────────────────────────
  - name: list_audit_log
    description: "List the immutable audit log (admin/auditor)."
    parameters:
      - name: limit
        description: "Result limit (default 100, max 500)"
        required: false
        multiline: false
        example: "100"
        schema:
          type: string
      - name: offset
        description: "Skip this many rows"
        required: false
        multiline: false
        example: "0"
        schema:
          type: string
      - name: actor
        description: "Filter by actor email"
        required: false
        multiline: false
        example: "analyst@example.com"
        schema:
          type: string
      - name: action
        description: "Filter by exact action name (e.g. ticket.update)"
        required: false
        multiline: false
        example: "ticket.update"
        schema:
          type: string
      - name: from_dt
        description: "Only entries at/after this time (ISO 8601)"
        required: false
        multiline: false
        example: "2026-08-01T00:00:00Z"
        schema:
          type: string
      - name: to_dt
        description: "Only entries at/before this time (ISO 8601)"
        required: false
        multiline: false
        example: "2026-08-05T00:00:00Z"
        schema:
          type: string
    returns:
      schema:
        type: object
  - name: list_report_runs
    description: "List report runs (scheduled/signed CISO & board reports)."
    parameters:
      - name: schedule_id
        description: "Filter by report schedule UUID"
        required: false
        multiline: false
        example: ""
        schema:
          type: string
      - name: limit
        description: "Result limit (default 50, max 200)"
        required: false
        multiline: false
        example: "20"
        schema:
          type: string
    returns:
      schema:
        type: array
  - name: get_report_run
    description: "Get details for a single report run."
    parameters:
      - name: run_id
        description: "Report run UUID"
        required: true
        multiline: false
        example: "00000000-0000-0000-0000-000000000000"
        schema:
          type: string
    returns:
      schema:
        type: object
