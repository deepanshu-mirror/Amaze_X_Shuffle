  - name: get_attack_path
    description: "Paginated multi-stage attack trails (IP attack path)."
    parameters:
      - name: site_id
        description: "Filter by site UUID"
        required: false
        multiline: false
        example: ""
        schema:
          type: string
      - name: page
        description: "Page number (default 1)"
        required: false
        multiline: false
        example: "1"
        schema:
          type: string
      - name: limit
        description: "Page size"
        required: false
